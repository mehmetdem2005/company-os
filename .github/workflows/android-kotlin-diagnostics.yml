name: Android Kotlin Diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "source/control-plane-v3/**"
      - "source/production-ui-primitives-v1/**"
      - "source/staged-control-plane-core-v2/**"
      - ".github/workflows/android-kotlin-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact production mobile workspace
        shell: bash
        run: |
          set -euo pipefail
          cat \
            source/mobile.zip.b64.part00 source/mobile.zip.b64.part01 \
            source/mobile.zip.b64.part02a source/mobile.zip.b64.part02b \
            source/mobile.zip.b64.part03 source/mobile.zip.b64.part04 \
            source/mobile.zip.b64.part05 source/mobile.zip.b64.part06a \
            source/mobile.zip.b64.part06b source/mobile.zip.b64.part07 \
            source/mobile.zip.b64.part08 source/mobile.zip.b64.part09 \
            source/mobile.zip.b64.part10 source/mobile.zip.b64.part11 \
            | base64 --decode > /tmp/mobile.zip
          echo "c72794030cc312fe8d6f8d01e5b021f6427b7200ba41b08ef7511508ddf2a8df  /tmp/mobile.zip" | sha256sum -c -
          unzip -q /tmp/mobile.zip

          cat source/no-mock-overlay/mobile-overlay.zip.b64.part* | base64 --decode > /tmp/no-mock.zip
          echo "fc112ad682df00662d0996dbc610cedd36b4394d742e77edff845218547c4ce9  /tmp/no-mock.zip" | sha256sum -c -
          unzip -qo /tmp/no-mock.zip
          patch -p1 < patches/no-mock/live-screens-filter.patch
          patch -p1 < patches/no-mock/godot-host-package.patch

          cat source/live-runtime-v2/mobile-overlay.zip.b64.part* | base64 --decode > /tmp/live.zip
          echo "fe254e84d6177bdeb6d2e04dd2b2761c7d72590b45dea38a917e3b5ac6bb7499  /tmp/live.zip" | sha256sum -c -
          unzip -qo /tmp/live.zip

          cat source/production-ui-primitives-v1/overlay.zip.b64 | base64 --decode > /tmp/ui.zip
          echo "84d36210059562dd67c9f427084a4fbb0b872bea8ccd61cd3aedb0eebceeceb1  /tmp/ui.zip" | sha256sum -c -
          unzip -qo /tmp/ui.zip

          rm -f \
            apps/mobile/src/features/dashboard/DashboardScreens.tsx \
            apps/mobile/src/features/organization/OrganizationScreens.tsx \
            apps/mobile/src/features/tasks/TaskScreens.tsx \
            apps/mobile/src/features/chat/ChatScreens.tsx \
            apps/mobile/src/features/policies/PolicyScreens.tsx \
            apps/mobile/src/features/workspace/WorkspaceScreens.tsx \
            apps/mobile/src/features/godot/GodotScreens.tsx \
            apps/mobile/src/features/operations/OperationsScreens.tsx

      - name: Apply exact production control-plane workspace
        shell: bash
        run: |
          set -euo pipefail
          cat source/database/company-os-schema.zip.b64.part* | base64 --decode > /tmp/schema.zip
          echo "62faa0469b86f20f03b49c2235a7c5d07dfb46b88f67a58a57e668dfc6375045  /tmp/schema.zip" | sha256sum -c -
          unzip -qo /tmp/schema.zip

          cat \
            source/control-plane-v3/overlay.zip.b64.part00 \
            source/control-plane-v3/overlay.zip.b64.part01a \
            source/control-plane-v3/overlay.zip.b64.part01b \
            source/control-plane-v3/overlay.zip.b64.part01c0 \
            source/control-plane-v3/overlay.zip.b64.part01c1 \
            source/control-plane-v3/overlay.zip.b64.part01c2 \
            source/control-plane-v3/overlay.zip.b64.part02a \
            source/control-plane-v3/overlay.zip.b64.part02b \
            source/control-plane-v3/overlay.zip.b64.part02c \
            source/control-plane-v3/overlay.zip.b64.part030 \
            source/control-plane-v3/overlay.zip.b64.part031 \
            source/control-plane-v3/overlay.zip.b64.part032 \
            | base64 --decode > /tmp/control.zip
          echo "704ba373f44c1913a76886a6306c2f68871eac6894fd3a925ea1dbcd07364dda  /tmp/control.zip" | sha256sum -c -
          unzip -qo /tmp/control.zip

          parts=(source/staged-control-plane-core-v2/archive.tar.xz.b64.part*)
          test "${#parts[@]}" -eq 9
          cat "${parts[@]}" | base64 --decode > /tmp/core.tar.xz
          echo "dc844d22af5e0a2b0c028c1f49a65688114abaedef0bfdf4ea1b5ef90632d312  /tmp/core.tar.xz" | sha256sum -c -
          xz --test /tmp/core.tar.xz
          tar -xJf /tmp/core.tar.xz -C .

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: android-actions/setup-android@v3

      - name: Install mobile dependencies and SDK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          npm install --workspaces=false --no-audit --no-fund
          test -d node_modules/@react-native/gradle-plugin
          cd ../..
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Create signing key
        shell: bash
        run: |
          set -euo pipefail
          rm -f apps/mobile/android/app/debug.keystore
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore apps/mobile/android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Company OS,C=TR"

      - name: Capture Gradle and Kotlin diagnostics
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p apps/mobile/android :app:assembleRelease \
            --stacktrace --info --no-daemon 2>&1 | tee /tmp/android-kotlin-build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-kotlin-production-build-diagnostics
          path: /tmp/android-kotlin-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail after diagnostics upload
        if: steps.android_build.outcome == 'failure'
        run: exit 1
