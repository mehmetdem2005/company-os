name: Android Production Control Plane V2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "source/control-plane-v3/**"
      - ".github/workflows/android-production-control-plane-v2.yml"

permissions:
  contents: read

concurrency:
  group: android-production-control-plane-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified mobile and real workspace source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            source/mobile.zip.b64.part00 \
            source/mobile.zip.b64.part01 \
            source/mobile.zip.b64.part02a \
            source/mobile.zip.b64.part02b \
            source/mobile.zip.b64.part03 \
            source/mobile.zip.b64.part04 \
            source/mobile.zip.b64.part05 \
            source/mobile.zip.b64.part06a \
            source/mobile.zip.b64.part06b \
            source/mobile.zip.b64.part07 \
            source/mobile.zip.b64.part08 \
            source/mobile.zip.b64.part09 \
            source/mobile.zip.b64.part10 \
            source/mobile.zip.b64.part11 \
            | base64 --decode > /tmp/company-os-mobile.zip
          echo "c72794030cc312fe8d6f8d01e5b021f6427b7200ba41b08ef7511508ddf2a8df  /tmp/company-os-mobile.zip" | sha256sum -c -
          unzip -t /tmp/company-os-mobile.zip
          unzip -q /tmp/company-os-mobile.zip

          cat source/no-mock-overlay/mobile-overlay.zip.b64.part* | base64 --decode > /tmp/no-mock-overlay.zip
          echo "fc112ad682df00662d0996dbc610cedd36b4394d742e77edff845218547c4ce9  /tmp/no-mock-overlay.zip" | sha256sum -c -
          unzip -t /tmp/no-mock-overlay.zip
          unzip -qo /tmp/no-mock-overlay.zip
          patch -p1 < patches/no-mock/live-screens-filter.patch
          patch -p1 < patches/no-mock/godot-host-package.patch

          cat source/live-runtime-v2/mobile-overlay.zip.b64.part* | base64 --decode > /tmp/live-runtime-v2.zip
          echo "fe254e84d6177bdeb6d2e04dd2b2761c7d72590b45dea38a917e3b5ac6bb7499  /tmp/live-runtime-v2.zip" | sha256sum -c -
          unzip -t /tmp/live-runtime-v2.zip
          unzip -qo /tmp/live-runtime-v2.zip

          rm -f \
            apps/mobile/src/features/dashboard/DashboardScreens.tsx \
            apps/mobile/src/features/organization/OrganizationScreens.tsx \
            apps/mobile/src/features/tasks/TaskScreens.tsx \
            apps/mobile/src/features/chat/ChatScreens.tsx \
            apps/mobile/src/features/policies/PolicyScreens.tsx \
            apps/mobile/src/features/workspace/WorkspaceScreens.tsx \
            apps/mobile/src/features/godot/GodotScreens.tsx \
            apps/mobile/src/features/operations/OperationsScreens.tsx

      - name: Restore verified production database schema
        shell: bash
        run: |
          set -euo pipefail
          cat source/database/company-os-schema.zip.b64.part* | base64 --decode > /tmp/company-os-schema.zip
          echo "62faa0469b86f20f03b49c2235a7c5d07dfb46b88f67a58a57e668dfc6375045  /tmp/company-os-schema.zip" | sha256sum -c -
          unzip -t /tmp/company-os-schema.zip
          unzip -qo /tmp/company-os-schema.zip

      - name: Apply verified production control-plane overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            source/control-plane-v3/overlay.zip.b64.part00 \
            source/control-plane-v3/overlay.zip.b64.part01a \
            source/control-plane-v3/overlay.zip.b64.part01b \
            source/control-plane-v3/overlay.zip.b64.part01c0 \
            source/control-plane-v3/overlay.zip.b64.part01c1 \
            source/control-plane-v3/overlay.zip.b64.part01c2 \
            source/control-plane-v3/overlay.zip.b64.part02a \
            source/control-plane-v3/overlay.zip.b64.part02b \
            source/control-plane-v3/overlay.zip.b64.part02c \
            source/control-plane-v3/overlay.zip.b64.part030 \
            source/control-plane-v3/overlay.zip.b64.part031 \
            source/control-plane-v3/overlay.zip.b64.part032 \
            | base64 --decode > /tmp/control-plane-v3.zip
          echo "704ba373f44c1913a76886a6306c2f68871eac6894fd3a925ea1dbcd07364dda  /tmp/control-plane-v3.zip" | sha256sum -c -
          unzip -t /tmp/control-plane-v3.zip
          unzip -qo /tmp/control-plane-v3.zip
          cat > apps/mobile/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "jsx": "react-jsx",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "exactOptionalPropertyTypes": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "resolveJsonModule": true,
              "noEmit": true,
              "types": ["react", "react-native"]
            },
            "include": ["src/**/*.ts", "src/**/*.tsx"],
            "exclude": ["node_modules", "android"]
          }
          JSON

      - name: Enforce no-mock and production schema contracts
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'Demo çalışma alanını aç|TASK-[0-9]+|Godot Mobile Alpha|BUILD #[0-9]+|POL-[0-9]+' apps/mobile/src apps/control-plane/src packages
          python - <<'PY'
          import re
          from pathlib import Path
          live = Path('apps/mobile/src/features/live/LiveScreens.tsx').read_text()
          schema = '\n'.join(path.read_text().lower() for path in sorted(Path('supabase/migrations').glob('*.sql')))
          tables = set(re.findall(r"table:\s*'([a-z_]+)'", live))
          tables.update(re.findall(r"useLiveRows\('([a-z_]+)'", live))
          missing = sorted(t for t in tables if f'create table public.{t}' not in schema and f'create table if not exists public.{t}' not in schema)
          if missing:
              raise SystemExit(f'Mobile tables missing from migrations: {missing}')
          required = [
              'bootstrap_workspace', 'supabase_realtime', 'messages_channel_member_insert',
              'apply_organization_plan', 'acquire_project_execution_lease',
              'release_project_execution_lease', 'project_execution_leases',
          ]
          absent = [name for name in required if name not in schema]
          if absent:
              raise SystemExit(f'Required production capabilities missing: {absent}')
          for signature in ('apply_organization_plan', 'acquire_project_execution_lease', 'release_project_execution_lease'):
              if f'grant execute on function public.{signature}' not in schema:
                  raise SystemExit(f'Service-role grant missing for {signature}')
          print('Validated real tables:', ', '.join(sorted(tables)))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: android-actions/setup-android@v3

      - name: Install mobile TypeScript toolchain
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Verify production control plane
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PWD/apps/mobile/node_modules/.bin:$PATH"
          tsc -p tsconfig.core.json --noEmit
          rm -rf dist
          tsc -p tsconfig.core.json
          node --test tests/*.test.mjs
          node scripts/architecture-check.mjs

      - name: Install Android platform packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Create signing key
        working-directory: apps/mobile/android/app
        shell: bash
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v -storetype PKCS12 -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Company OS,C=TR"

      - name: Build release APK
        run: gradle -p apps/mobile/android :app:assembleRelease --stacktrace --no-daemon

      - name: Verify and package deliverables
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee "$APK.sha256"
          rm -rf dist node_modules apps/mobile/node_modules apps/mobile/android/.gradle apps/mobile/android/build
          rm -f apps/mobile/android/app/debug.keystore
          zip -qr /tmp/company-os-production-control-plane-source.zip . \
            -x '.git/*' '*/node_modules/*' '*/build/*' 'dist/*'
          unzip -t /tmp/company-os-production-control-plane-source.zip >/dev/null
          sha256sum /tmp/company-os-production-control-plane-source.zip > /tmp/company-os-production-control-plane-source.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: company-os-production-control-plane-v2
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            /tmp/company-os-production-control-plane-source.zip
            /tmp/company-os-production-control-plane-source.zip.sha256
            supabase/migrations/0005_runtime_control_plane.sql
            supabase/migrations/0006_project_execution_leases.sql
          if-no-files-found: error
          retention-days: 14
