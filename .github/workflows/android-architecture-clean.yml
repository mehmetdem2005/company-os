name: Android Architecture Clean APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/ui-architecture/**"
      - ".github/workflows/android-architecture-clean.yml"

permissions:
  contents: read

concurrency:
  group: android-architecture-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified mobile source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            source/mobile.zip.b64.part00 \
            source/mobile.zip.b64.part01 \
            source/mobile.zip.b64.part02a \
            source/mobile.zip.b64.part02b \
            source/mobile.zip.b64.part03 \
            source/mobile.zip.b64.part04 \
            source/mobile.zip.b64.part05 \
            source/mobile.zip.b64.part06a \
            source/mobile.zip.b64.part06b \
            source/mobile.zip.b64.part07 \
            source/mobile.zip.b64.part08 \
            source/mobile.zip.b64.part09 \
            source/mobile.zip.b64.part10 \
            source/mobile.zip.b64.part11 \
            | base64 --decode > /tmp/company-os-mobile.zip
          echo "c72794030cc312fe8d6f8d01e5b021f6427b7200ba41b08ef7511508ddf2a8df  /tmp/company-os-mobile.zip" | sha256sum -c -
          unzip -t /tmp/company-os-mobile.zip
          unzip -q /tmp/company-os-mobile.zip

          cat source/no-mock-overlay/mobile-overlay.zip.b64.part* | base64 --decode > /tmp/no-mock-overlay.zip
          echo "fc112ad682df00662d0996dbc610cedd36b4394d742e77edff845218547c4ce9  /tmp/no-mock-overlay.zip" | sha256sum -c -
          unzip -t /tmp/no-mock-overlay.zip
          unzip -qo /tmp/no-mock-overlay.zip
          patch -p1 < patches/no-mock/live-screens-filter.patch
          patch -p1 < patches/no-mock/godot-host-package.patch

          cat source/live-runtime-v2/mobile-overlay.zip.b64.part* | base64 --decode > /tmp/live-runtime-v2.zip
          echo "fe254e84d6177bdeb6d2e04dd2b2761c7d72590b45dea38a917e3b5ac6bb7499  /tmp/live-runtime-v2.zip" | sha256sum -c -
          unzip -t /tmp/live-runtime-v2.zip
          unzip -qo /tmp/live-runtime-v2.zip

          base64 --decode source/ui-architecture/primitives-overlay.zip.b64 > /tmp/primitives-overlay.zip
          echo "84d36210059562dd67c9f427084a4fbb0b872bea8ccd61cd3aedb0eebceeceb1  /tmp/primitives-overlay.zip" | sha256sum -c -
          unzip -t /tmp/primitives-overlay.zip
          unzip -qo /tmp/primitives-overlay.zip

          rm -f \
            apps/mobile/src/features/dashboard/DashboardScreens.tsx \
            apps/mobile/src/features/organization/OrganizationScreens.tsx \
            apps/mobile/src/features/tasks/TaskScreens.tsx \
            apps/mobile/src/features/chat/ChatScreens.tsx \
            apps/mobile/src/features/policies/PolicyScreens.tsx \
            apps/mobile/src/features/workspace/WorkspaceScreens.tsx \
            apps/mobile/src/features/godot/GodotScreens.tsx \
            apps/mobile/src/features/operations/OperationsScreens.tsx

          test "$(wc -l < apps/mobile/src/components/primitives.tsx)" -le 360
          ! grep -RInE 'Demo çalışma alanını aç|TASK-[0-9]+|Godot Mobile Alpha|BUILD #[0-9]+|POL-[0-9]+' apps/mobile/src

          cat > apps/mobile/tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "jsx": "react-jsx",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "exactOptionalPropertyTypes": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "resolveJsonModule": true,
              "noEmit": true,
              "types": ["react", "react-native"]
            },
            "include": ["src/**/*.ts", "src/**/*.tsx"],
            "exclude": ["node_modules", "android"]
          }
          JSON

      - name: Restore and validate production schema
        shell: bash
        run: |
          set -euo pipefail
          cat source/database/company-os-schema.zip.b64.part* | base64 --decode > /tmp/company-os-schema.zip
          echo "62faa0469b86f20f03b49c2235a7c5d07dfb46b88f67a58a57e668dfc6375045  /tmp/company-os-schema.zip" | sha256sum -c -
          unzip -t /tmp/company-os-schema.zip
          unzip -qo /tmp/company-os-schema.zip
          python - <<'PY'
          import re
          from pathlib import Path
          live = Path('apps/mobile/src/features/live/LiveScreens.tsx').read_text()
          schema = Path('supabase/migrations/0001_company_os.sql').read_text().lower()
          tables = set(re.findall(r"table:\s*'([a-z_]+)'", live))
          tables.update(re.findall(r"useLiveRows\('([a-z_]+)'", live))
          missing = sorted(t for t in tables if f'create table public.{t}' not in schema and f'create table if not exists public.{t}' not in schema)
          if missing:
              raise SystemExit(f'Mobile tables missing from schema: {missing}')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install and typecheck
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Create signing key
        working-directory: apps/mobile/android/app
        shell: bash
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v -storetype PKCS12 -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Company OS,C=TR"

      - name: Build and verify release APK
        shell: bash
        run: |
          gradle -p apps/mobile/android :app:assembleRelease --stacktrace --no-daemon
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: company-os-architecture-clean
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
            supabase/migrations/0001_company_os.sql
          if-no-files-found: error
          retention-days: 14
